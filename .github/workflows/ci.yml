name: CI Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m
        run: ./gradlew :composeApp:assembleDebug --no-daemon -Dorg.gradle.workers.max=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfoTB-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build iOS framework
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --no-daemon -Pkotlin.native.jvmArgs=-Xmx4g -Dorg.gradle.workers.max=1

      - name: Build iOS App
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/iosApp.xcarchive/Products/Applications/InfoTB.app build/Payload/
          cd build && zip -r InfoTB-debug.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InfoTB-debug-ipa
          path: build/InfoTB-debug.ipa
          retention-days: 7
