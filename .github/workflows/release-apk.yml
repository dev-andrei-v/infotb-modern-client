name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

      # The heap belongs to the Gradle build process (org.gradle.jvmargs), where
      # D8 merges dex files; GRADLE_OPTS only sizes the small launcher.
      - name: Build Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon -Dorg.gradle.workers.max=1 "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfoTB-modern-apk
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: InfoTB-modern-apk

      - name: Rename APK
        run: mv *.apk "InfoTB-modern_${GITHUB_REF#refs/tags/}.apk"

      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
          path: repo

      # Hand-written notes for this tag go first; GitHub's generated list follows.
      - name: Pick release notes
        run: |
          notes="repo/.github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: InfoTB-modern_${{ github.ref_name }}.apk
