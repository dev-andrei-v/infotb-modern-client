name: Build & Release IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Kotlin framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=1

      - name: Build unsigned IPA
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p build/Payload
          cp -r build/iosApp.xcarchive/Products/Applications/InfoTB.app build/Payload/
          cd build && zip -r InfoTB.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfoTB-modern-ipa
          path: build/InfoTB.ipa
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: InfoTB-modern-ipa

      - name: Rename IPA
        run: mv InfoTB.ipa "InfoTB-modern_${GITHUB_REF#refs/tags/}.ipa"

      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
          path: repo

      # Hand-written notes for this tag go first; GitHub's generated list follows.
      - name: Pick release notes
        run: |
          notes="repo/.github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: InfoTB-modern_${{ github.ref_name }}.ipa
